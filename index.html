<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>

<!-- Set the theme before first paint so there's no white flash in dark mode. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark"
                     : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap">
<!-- ?v=N busts GitHub Pages' 10-minute cache. Bump it when you change a file. -->
<link rel="stylesheet" href="style.css?v=58">

<!-- Your content. Loaded before the renderer so it's available immediately. -->
<script src="resume.js?v=58"></script>
</head>

<body>

<button class="theme" id="theme" type="button" aria-label="Switch colour theme">
  <span class="theme__dot"></span>
</button>

<main class="shell">
  <article class="card" id="card">
    <button class="card__toggle" id="card-toggle" type="button"
            aria-expanded="true" aria-controls="card-body"
            aria-label="Minimise"><span></span></button>
    <span class="card__tab" id="card-tab" aria-hidden="true"></span>
    <div class="card__body" id="card-body">
      <section class="card__intro" id="intro"></section>
      <section class="card__term"  id="termcol"></section>
      <nav class="card__links" id="links" aria-label="Links"></nav>
    </div>
  </article>
</main>

<!--
  The full document — experience, projects, writing, everything in resume.js.
  Hidden on screen (the terminal is how you browse it) but laid out properly
  for print, so ⌘P still gives a clean one-page résumé from the same source.
-->
<div class="doc" id="doc"></div>

<noscript>
  <div class="shell">
    <p>This site renders from a small data file using JavaScript. Please enable it,
       or read <a href="resume.js">resume.js</a> directly — it's plain text.</p>
  </div>
</noscript>

<script src="site.js?v=58"></script>
<script src="canvas.js?v=58"></script>
<script src="terminal.js?v=58"></script>
</body>
</html>
